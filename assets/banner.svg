<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Pulse Radial Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseA {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
        50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.7; }
      }
      @keyframes pulseB {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.65; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes particleDrift {
        0% { transform: translateY(0) translateX(0); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-40px) translateX(25px); opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glow-pulse-1 {
        animation: pulseA 7s ease-in-out infinite;
        transform-origin: 180px 180px;
      }
      .glow-pulse-2 {
        animation: pulseB 9s ease-in-out infinite;
        transform-origin: 1020px 180px;
      }
      .circuit-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 4s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 12, 12;
        animation: dashFlow 2.5s linear infinite;
      }
      .shield-anim {
        animation: floatShield 4s ease-in-out infinite;
        transform-origin: center;
      }
      .particle-1 { animation: particleDrift 3.5s ease-in-out infinite; }
      .particle-2 { animation: particleDrift 4.8s ease-in-out 1s infinite; }
      .particle-3 { animation: particleDrift 4.2s ease-in-out 2s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <g class="glow-pulse-1">
    <circle cx="200" cy="180" r="180" fill="url(#cyanGlow)" />
  </g>
  <g class="glow-pulse-2">
    <circle cx="1000" cy="180" r="210" fill="url(#purpleGlow)" />
  </g>

  <!-- Tech Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Data Stream Circuit Lines (Background) -->
  <path d="M 80,180 L 220,180 L 280,240 L 460,240" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.35" class="circuit-line" />
  <path d="M 740,120 L 920,120 L 980,180 L 1120,180" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-opacity="0.35" class="circuit-line-fast" />
  <path d="M 120,80 L 260,80 L 320,140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" class="circuit-line" />

  <!-- Dynamic Floating Particles -->
  <circle cx="240" cy="220" r="3" fill="#00f2fe" class="particle-1" />
  <circle cx="950" cy="140" r="3.5" fill="#a78bfa" class="particle-2" />
  <circle cx="380" cy="270" r="2.5" fill="#38bdf8" class="particle-3" />
  <circle cx="850" cy="260" r="2" fill="#00f2fe" class="particle-1" />

  <!-- Left Medical / Shield Emblem (Dynamic Floating) -->
  <g class="shield-anim" transform="translate(110, 120)">
    <!-- Shield Outer Glow -->
    <path d="M50 5 L90 22 C90 65 50 88 50 88 C50 88 10 65 10 22 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glowFilter)" opacity="0.6" />
    <!-- Shield Body -->
    <path d="M50 5 L90 22 C90 65 50 88 50 88 C50 88 10 65 10 22 Z" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" />
    <!-- Medical Cross with Lock Symbol -->
    <rect x="45" y="30" width="10" height="32" rx="3" fill="#38bdf8" />
    <rect x="34" y="41" width="32" height="10" rx="3" fill="#38bdf8" />
    <circle cx="50" cy="46" r="3" fill="#0f172a" />
  </g>

  <!-- Right Compliance Node Badge (Decorative) -->
  <g class="shield-anim" transform="translate(1000, 120)">
    <!-- Audit Node Hexagon -->
    <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" />
    <!-- Checkmark & Pulse Inside -->
    <path d="M36 50 L46 60 L65 38" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Content Layer (Foreground - Never Obscured) -->
  <g id="foreground-content">
    <!-- Top Micro Tag Pill -->
    <g transform="translate(420, 48)">
      <rect width="360" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="16" r="5" fill="#22c55e" />
      <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1.2">HIPAA SECURITY &amp; PRIVACY AUTOMATION</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Healthcare HIPAA Compliance
    </text>
    <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#subTextGrad)" letter-spacing="-0.5">
      Automation Ecosystem
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Curated SaaS Platforms, Open-Source Tools &amp; CI/CD Pipelines for HealthTech Compliance
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(230, 268)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🛡️ PHI Sanitization</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="180" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="270" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">📋 Tamper-Evident Logs</text>

      <!-- Tag 3 -->
      <rect x="380" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="465" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ CI/CD Gate Scanners</text>

      <!-- Tag 4 -->
      <rect x="570" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="655" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">🤖 HealthTech GRC</text>
    </g>
  </g>
</svg>
